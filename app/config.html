<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuracion — AlertaPrecio MX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo">AlertaPrecio</div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">📊 Overview</a>
        <a href="productos.html" class="nav-item">📦 Productos</a>
        <a href="alertas.html" class="nav-item">🔔 Alertas</a>
        <a href="config.html" class="nav-item active">⚙️ Config</a>
      </nav>
      <div class="sidebar-footer">
        <span class="plan-badge-sidebar" id="plan-badge">Plan: Starter</span>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <h1>Configuracion</h1>
      </header>
      <div class="content-area">
        <!-- Account Section -->
        <div class="config-section">
          <h2>Cuenta</h2>
          <div id="account-info">
            <div class="loading">Cargando...</div>
          </div>
        </div>

        <!-- Notifications Section -->
        <div class="config-section">
          <h2>Notificaciones</h2>
          <form id="notifications-form">
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="notify-whatsapp" checked>
                WhatsApp
              </label>
            </div>
            <div class="form-group">
              <label for="notify-whatsapp-number">Numero de WhatsApp</label>
              <input type="tel" id="notify-whatsapp-number" placeholder="+525512345678">
            </div>
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="notify-email">
                Email
              </label>
            </div>
            <div class="form-group">
              <label for="notify-email-addr">Direccion de Email</label>
              <input type="email" id="notify-email-addr" placeholder="correo@ejemplo.com">
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </form>
        </div>

        <!-- Monitor Section -->
        <div class="config-section">
          <h2>Frecuencia de Monitoreo</h2>
          <form id="monitor-form">
            <div class="form-group">
              <label for="monitor-frequency">Cada cuantas horas?</label>
              <select id="monitor-frequency">
                <option value="4">4 horas</option>
                <option value="6">6 horas</option>
                <option value="12">12 horas</option>
                <option value="24">24 horas (diario)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="monitor-digest">Hora del resumen diario</label>
              <select id="monitor-digest">
                <option value="8">8:00 AM</option>
                <option value="9">9:00 AM</option>
                <option value="10">10:00 AM</option>
                <option value="18">6:00 PM</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
