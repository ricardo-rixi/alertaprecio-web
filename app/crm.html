<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — AlertaPrecio MX</title>
<link rel="stylesheet" href="css/style.css">
<style>
.crm-layout { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; min-height: calc(100vh - 120px); }
.pipeline-col { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem; display: flex; flex-direction: column; }
.pipeline-col h3 { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.4rem; text-align: center; }
.pipeline-col .count { font-size: 1.3rem; font-weight: 800; text-align: center; color: var(--accent); margin-bottom: 0.5rem; }
.lead-card {
  background: rgba(255,255,255,0.03); border-radius: 6px; padding: 0.5rem 0.6rem;
  margin-bottom: 0.3rem; font-size: 0.78rem; cursor: pointer;
  border-left: 3px solid var(--primary); transition: all 0.15s;
}
.lead-card:hover { background: rgba(37,99,235,0.15); border-left-color: var(--accent); }
.lead-card .ln { font-weight: 600; }
.lead-card .lc { color: var(--text-muted); font-size: 0.7rem; }
.lead-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; position: sticky; top: 1rem; max-height: calc(100vh - 140px); overflow-y: auto; }
.lead-panel h2 { font-size: 1rem; margin-bottom: 1rem; }
.lead-panel .field { margin-bottom: 0.8rem; }
.lead-panel .field label { display: block; font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.2rem; }
.lead-panel .field input, .lead-panel .field select {
  width: 100%; padding: 0.5rem 0.6rem; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 0.85rem;
}
.lead-panel .field input:focus, .lead-panel .field select:focus { outline: none; border-color: var(--primary); }
.contact-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; font-size: 0.78rem; border-bottom: 1px solid var(--border); }
.contact-row .type { color: var(--accent); font-weight: 600; font-size: 0.68rem; }
.contact-row .notes { color: var(--text-muted); flex: 1; }
.actions { display: flex; gap: 0.4rem; margin-top: 1rem; flex-wrap: wrap; }
.empty-pipeline { text-align: center; color: var(--text-muted); padding: 2rem; font-size: 0.85rem; }
.empty-pipeline button { margin-top: 0.5rem; }
.stats-bar { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
.stat-pill { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.78rem; }
.stat-pill .sv { font-size: 1.2rem; font-weight: 700; }
.stat-pill .sl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="sidebar-logo">AlertaPrecio</div>
  <nav class="sidebar-nav">
    <a href="index.html" class="nav-item">📊 Overview</a>
    <a href="productos.html" class="nav-item">📦 Productos</a>
    <a href="alertas.html" class="nav-item">🔔 Alertas</a>
    <a href="config.html" class="nav-item">⚙️ Config</a>
    <a href="crm.html" class="nav-item active">📋 CRM</a>
  </nav>
  <div class="sidebar-footer"><span class="plan-badge-sidebar">CRM Activo</span></div>
</aside>
<main class="main-content">
<header class="topbar">
  <h1>CRM Interno</h1>
  <div><button class="btn btn-primary btn-sm" onclick="newLead()">+ Nuevo Lead</button></div>
</header>
<div class="content-area">
  <div class="stats-bar" id="stats-bar"></div>
  <div class="crm-layout">
    <div id="pipeline-container" style="display:grid;grid-template-columns:repeat(7,1fr);gap:0.5rem"></div>
    <div class="lead-panel" id="lead-panel">
      <p style="color:var(--text-muted);text-align:center;padding-top:2rem">Selecciona un lead para ver detalle</p>
    </div>
  </div>
</div>
</main>
</div>

<script>
// ========== DATA STORE (localStorage) ==========
var STAGES = ['lead_nuevo','contactado','demo_agendada','demo_realizada','trial_activo','cliente','churned'];
var STAGE_LABELS = {lead_nuevo:'Nuevo',contactado:'Contactado',demo_agendada:'Demo Agendada',demo_realizada:'Demo Hecha',trial_activo:'Trial Activo',cliente:'Cliente',churned:'Churned'};
var STAGE_COLORS = {lead_nuevo:'#94a3b8',contactado:'#3b82f6',demo_agendada:'#f59e0b',demo_realizada:'#8b5cf6',trial_activo:'#10b981',cliente:'#00c896',churned:'#ef4444'};

function loadLeads() {
  var raw = localStorage.getItem('crm_leads');
  return raw ? JSON.parse(raw) : [];
}
function saveLeads(leads) {
  localStorage.setItem('crm_leads', JSON.stringify(leads));
}
function loadContacts() {
  var raw = localStorage.getItem('crm_contacts');
  return raw ? JSON.parse(raw) : [];
}
function saveContacts(contacts) {
  localStorage.setItem('crm_contacts', JSON.stringify(contacts));
}

// Seed data if empty
if (!localStorage.getItem('crm_leads')) {
  var seed = [
    {id:1,name:'Carlos Mendoza',company:'Electronics Pro',email:'carlos@electropro.mx',whatsapp:'+525518887766',platform:'mercadolibre',category:'Electrónicos',stage:'lead_nuevo',source:'directo',notes:''},
    {id:2,name:'Lupita Sanchez',company:'Accesorios Lupita',email:'lupita@accesorios.mx',whatsapp:'+525531234567',platform:'amazon',category:'Moda',stage:'lead_nuevo',source:'directo',notes:''},
    {id:3,name:'Miguel Angel Ruiz',company:'Digital Store MX',email:'miguel@digitalstore.mx',whatsapp:'+525541112233',platform:'mercadolibre',category:'Videojuegos',stage:'lead_nuevo',source:'directo',notes:''},
    {id:4,name:'Fernanda Lopez',company:'MegaShop Mexico',email:'fer@megashop.mx',whatsapp:'+525558889900',platform:'shopify',category:'Electrónicos',stage:'contactado',source:'directo',notes:'Interesada en plan Pro'},
    {id:5,name:'Roberto Nunez',company:'TechCenter',email:'roberto@techcenter.mx',whatsapp:'+525572223344',platform:'amazon',category:'Audio',stage:'contactado',source:'directo',notes:''},
    {id:6,name:'Ana Ochoa',company:'AudioPro MX',email:'ana@audiopro.mx',whatsapp:'+525563334455',platform:'mercadolibre',category:'Audio',stage:'contactado',source:'directo',notes:''},
    {id:7,name:'Pedro Castillo',company:'ElectroMex Oficial',email:'pedro@electromex.mx',whatsapp:'+525591122233',platform:'mercadolibre',category:'Electrónicos',stage:'demo_agendada',source:'directo',notes:'Demo miercoles 3pm'},
    {id:8,name:'Sofia Ramirez',company:'Gadgets Premium',email:'sofia@gadgets.mx',whatsapp:'+525544556677',platform:'shopify',category:'Electrónicos',stage:'demo_realizada',source:'directo',notes:'Quiere trial de 14 dias'},
    {id:9,name:'Jorge Herrera',company:'Deportes Total',email:'jorge@deportes.mx',whatsapp:'+525577889900',platform:'mercadolibre',category:'Deportes',stage:'trial_activo',source:'directo',notes:''},
    {id:10,name:'Valeria Diaz',company:'HogarStyle',email:'valeria@hogarstyle.mx',whatsapp:'+525533221100',platform:'amazon',category:'Hogar',stage:'trial_activo',source:'directo',notes:''},
    {id:11,name:'Oscar Torres',company:'PC Gamer Shop',email:'oscar@pcgamer.mx',whatsapp:'+525566554433',platform:'mercadolibre',category:'Electrónicos',stage:'cliente',source:'directo',notes:'Plan Pro — $499/mes'},
    {id:12,name:'Ministore MX',company:'MiniStore',email:'',whatsapp:'+525599887766',platform:'shopify',category:'Moda',stage:'churned',source:'directo',notes:'Cerro tienda'},
  ];
  saveLeads(seed);
  var seedContacts = [
    {id:1,lead_id:4,type:'whatsapp',result:'interesado',notes:'Quiere demo el lunes',created_at:new Date().toISOString()},
    {id:2,lead_id:5,type:'email',result:'pendiente',notes:'Esperando respuesta',created_at:new Date().toISOString()},
    {id:3,lead_id:6,type:'whatsapp',result:'confirmada',notes:'Demo miercoles 3pm',created_at:new Date().toISOString()},
    {id:4,lead_id:7,type:'whatsapp',result:'confirmada',notes:'Confirmo asistencia',created_at:new Date().toISOString()},
    {id:5,lead_id:11,type:'email',result:'cliente',notes:'Facturacion enviada',created_at:new Date().toISOString()},
  ];
  saveContacts(seedContacts);
}

// ========== RENDER ==========
var selectedLead = null;

function render() {
  var leads = loadLeads();
  var container = document.getElementById('pipeline-container');
  var html = '';
  STAGES.forEach(function(stage) {
    var stageLeads = leads.filter(function(l) { return l.stage === stage; });
    html += '<div class="pipeline-col"><h3>' + STAGE_LABELS[stage] + '</h3><div class="count" style="color:' + (STAGE_COLORS[stage]||'#fff') + '">' + stageLeads.length + '</div>';
    stageLeads.forEach(function(l) {
      html += '<div class="lead-card" style="border-left-color:' + (STAGE_COLORS[stage]||'#fff') + '" onclick="selectLead(' + l.id + ')" draggable="true" data-id="' + l.id + '">'
        + '<div class="ln">' + esc(l.name) + '</div>'
        + '<div class="lc">' + esc(l.company) + ' · ' + esc(l.platform) + '</div></div>';
    });
    html += '</div>';
  });
  container.innerHTML = html;

  // Stats
  var stats = document.getElementById('stats-bar');
  stats.innerHTML = '<div class="stat-pill"><div class="sv" style="color:var(--accent)">' + leads.length + '</div><div class="sl">Total Leads</div></div>'
    + '<div class="stat-pill"><div class="sv" style="color:var(--primary)">' + leads.filter(function(l){return l.stage!=='churned'}).length + '</div><div class="sl">Activos</div></div>'
    + '<div class="stat-pill"><div class="sv" style="color:var(--success)">' + leads.filter(function(l){return l.stage==='trial_activo'}).length + '</div><div class="sl">Trials</div></div>'
    + '<div class="stat-pill"><div class="sv" style="color:#f59e0b">' + leads.filter(function(l){return l.stage==='lead_nuevo'||l.stage==='contactado'}).length + '</div><div class="sl">Por Contactar</div></div>'
    + '<div class="stat-pill"><div class="sv" style="color:var(--danger)">' + leads.filter(function(l){return l.stage==='churned'}).length + '</div><div class="sl">Churn</div></div>';

  // Update panel if lead selected
  if (selectedLead) {
    var updated = leads.find(function(l) { return l.id === selectedLead.id; });
    if (updated) showLeadPanel(updated);
  }
}

function selectLead(id) {
  var leads = loadLeads();
  selectedLead = leads.find(function(l) { return l.id === id; });
  if (selectedLead) showLeadPanel(selectedLead);
}

function showLeadPanel(lead) {
  var contacts = loadContacts().filter(function(c) { return c.lead_id === lead.id; });
  var panel = document.getElementById('lead-panel');
  panel.innerHTML = '<h2>' + esc(lead.name) + '</h2>'
    + '<div class="field"><label>Empresa</label><input id="edit-company" value="' + esc(lead.company) + '"></div>'
    + '<div class="field"><label>Email</label><input id="edit-email" type="email" value="' + esc(lead.email||'') + '"></div>'
    + '<div class="field"><label>WhatsApp</label><input id="edit-whatsapp" value="' + esc(lead.whatsapp||'') + '"></div>'
    + '<div class="field"><label>Plataforma</label><select id="edit-platform"><option value="mercadolibre"' + (lead.platform==='mercadolibre'?' selected':'') + '>Mercado Libre</option><option value="amazon"' + (lead.platform==='amazon'?' selected':'') + '>Amazon</option><option value="shopify"' + (lead.platform==='shopify'?' selected':'') + '>Shopify</option><option value="other"' + (lead.platform==='other'?' selected':'') + '>Otra</option></select></div>'
    + '<div class="field"><label>Categoria</label><input id="edit-category" value="' + esc(lead.category||'') + '"></div>'
    + '<div class="field"><label>Etapa</label><select id="edit-stage">'
    + STAGES.map(function(s) { return '<option value="' + s + '"' + (lead.stage===s?' selected':'') + '>' + STAGE_LABELS[s] + '</option>'; }).join('')
    + '</select></div>'
    + '<div class="field"><label>Notas</label><input id="edit-notes" value="' + esc(lead.notes||'') + '"></div>'
    + '<div class="actions">'
    + '<button class="btn btn-sm btn-primary" onclick="saveLead(' + lead.id + ')">💾 Guardar</button>'
    + '<button class="btn btn-sm btn-danger" onclick="deleteLead(' + lead.id + ')">🗑️ Eliminar</button>'
    + '</div>'
    + '<div style="margin-top:1rem"><strong style="font-size:0.8rem">Contactos (' + contacts.length + ')</strong></div>'
    + contacts.map(function(c) {
        return '<div class="contact-row"><span class="type">' + c.type.toUpperCase() + '</span><span class="notes">' + esc(c.result||'') + ': ' + esc(c.notes||'') + '</span></div>';
      }).join('')
    + '<button class="btn btn-sm" style="margin-top:0.5rem;width:100%" onclick="addContact(' + lead.id + ')">+ Agregar Contacto</button>';
}

function saveLead(id) {
  var leads = loadLeads();
  var idx = leads.findIndex(function(l) { return l.id === id; });
  if (idx < 0) return;
  leads[idx].company = document.getElementById('edit-company').value.trim();
  leads[idx].email = document.getElementById('edit-email').value.trim();
  leads[idx].whatsapp = document.getElementById('edit-whatsapp').value.trim();
  leads[idx].platform = document.getElementById('edit-platform').value;
  leads[idx].category = document.getElementById('edit-category').value.trim();
  leads[idx].stage = document.getElementById('edit-stage').value;
  leads[idx].notes = document.getElementById('edit-notes').value.trim();
  saveLeads(leads);
  selectedLead = leads[idx];
  render();
}

function deleteLead(id) {
  if (!confirm('Eliminar este lead?')) return;
  var leads = loadLeads().filter(function(l) { return l.id !== id; });
  saveLeads(leads);
  var contacts = loadContacts().filter(function(c) { return c.lead_id !== id; });
  saveContacts(contacts);
  selectedLead = null;
  document.getElementById('lead-panel').innerHTML = '<p style="color:var(--text-muted);text-align:center;padding-top:2rem">Selecciona un lead</p>';
  render();
}

function newLead() {
  var name = prompt('Nombre del lead:');
  if (!name) return;
  var leads = loadLeads();
  var maxId = leads.length > 0 ? Math.max.apply(null, leads.map(function(l){return l.id;})) : 0;
  var lead = {id:maxId+1,name:name,company:'',email:'',whatsapp:'',platform:'mercadolibre',category:'',stage:'lead_nuevo',source:'manual',notes:''};
  leads.push(lead);
  saveLeads(leads);
  selectedLead = lead;
  render();
  showLeadPanel(lead);
}

function addContact(leadId) {
  var type = prompt('Tipo (whatsapp/email/llamada/demo):', 'whatsapp');
  if (!type) return;
  var result = prompt('Resultado:', 'contactado');
  var notes = prompt('Notas:', '');
  var contacts = loadContacts();
  var maxId = contacts.length > 0 ? Math.max.apply(null, contacts.map(function(c){return c.id;})) : 0;
  contacts.push({id:maxId+1,lead_id:leadId,type:type,result:result||'',notes:notes||'',created_at:new Date().toISOString()});
  saveContacts(contacts);
  showLeadPanel(selectedLead);
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = (s||'').toString();
  return d.innerHTML;
}

render();
</script>
</body>
</html>
