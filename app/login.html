<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlertaPrecio MX — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .auth-container { width: 100%; max-width: 460px; }
    .auth-box {
      background: var(--bg-card); padding: 2.5rem; border-radius: 16px;
      border: 1px solid var(--border);
    }
    .auth-box h1 { text-align: center; color: var(--accent); margin-bottom: 0.3rem; }
    .auth-box .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
    .auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .auth-tab {
      flex: 1; padding: 0.8rem; text-align: center; cursor: pointer;
      color: var(--text-muted); font-weight: 600; font-size: 0.9rem;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .form-row { display: flex; gap: 0.75rem; }
    .form-row .form-group { flex: 1; }
    .demo-card {
      background: rgba(37,99,235,0.08); border: 1px solid rgba(37,99,235,0.15);
      border-radius: 12px; padding: 1.2rem; margin-top: 1.5rem;
    }
    .demo-card h3 { color: var(--primary); margin-bottom: 0.5rem; font-size: 0.9rem; }
    .demo-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.4rem 0; font-size: 0.82rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .demo-row:last-child { border: none; }
    .demo-btn { width: 100%; margin-top: 0.6rem; }
    .error-msg { color: var(--danger); font-size: 0.82rem; margin: 0.5rem 0; display: none; }
    .success-msg { color: var(--success); font-size: 0.82rem; margin: 0.5rem 0; display: none; }
    /* Register success page */
    .success-page { text-align: center; padding: 2rem 0; display: none; }
    .success-page .check { font-size: 4rem; margin-bottom: 1rem; }
    .success-page h2 { color: var(--success); margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>AlertaPrecio</h1>
      <p class="subtitle">Monitoreo inteligente de precios</p>

      <!-- Tabs -->
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchTab('login')">Iniciar Sesión</div>
        <div class="auth-tab" onclick="switchTab('register')">Crear Cuenta</div>
      </div>

      <!-- Login Form -->
      <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <div class="error-msg" id="login-error"></div>
        <button type="submit" class="btn btn-primary" style="width:100%">Iniciar Sesión</button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="register-form" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="reg-name" placeholder="Tu nombre" required>
          </div>
          <div class="form-group">
            <label>Apellido</label>
            <input type="text" id="reg-lastname" placeholder="Tu apellido">
          </div>
        </div>
        <div class="form-group">
          <label>Nombre de la Empresa</label>
          <input type="text" id="reg-company" placeholder="Tienda Oficial S.A. (opcional)">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label>WhatsApp</label>
          <input type="tel" id="reg-whatsapp" placeholder="+52 55 1234 5678">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required minlength="8">
          </div>
          <div class="form-group">
            <label>Confirmar</label>
            <input type="password" id="reg-password2" placeholder="Repite la contraseña" required minlength="8">
          </div>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="reg-terms" required style="width:auto; margin-right:0.5rem">
            Acepto los términos y condiciones
          </label>
        </div>
        <div class="error-msg" id="reg-error"></div>
        <div class="success-msg" id="reg-success"></div>
        <button type="submit" class="btn btn-primary" style="width:100%">Comenzar Prueba Gratis de 14 Días</button>
        <p style="text-align:center; font-size:0.77rem; color:var(--text-muted); margin-top:0.75rem">
          Sin tarjeta de crédito • Cancela cuando quieras
        </p>
      </form>

      <!-- Post-register success -->
      <div class="success-page" id="success-page">
        <div class="check">✅</div>
        <h2>¡Cuenta Creada!</h2>
        <p style="color:var(--text-muted); margin-bottom:1.5rem">Tu prueba gratuita de 14 días en plan <strong>Pro</strong> está activa. Redirigiendo al dashboard...</p>
      </div>

      <!-- Demo Quick Access -->
      <div class="demo-card">
        <h3>🔑 Acceso Demo</h3>
        <div class="demo-row"><span>Marco Tienda Oficial</span><span style="color:var(--accent);font-weight:600">PRO</span></div>
        <div class="demo-row"><span>Ana Seller Digital</span><span style="color:var(--accent);font-weight:600">STARTER</span></div>
        <button class="btn btn-primary demo-btn" onclick="loginAs('pro')">Entrar como Pro (12 productos)</button>
        <button class="btn btn-outline demo-btn" onclick="loginAs('starter')" style="margin-top:0.4rem">Entrar como Starter (4 productos)</button>
      </div>
    </div>
  </div>

  <script>
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    document.querySelector(`.auth-tab:nth-child(${tab === 'login' ? 1 : 2})`).classList.add('active');
    document.getElementById(tab + '-form').classList.add('active');
    document.querySelectorAll('.error-msg').forEach(e => e.style.display = 'none');
  }

  function handleLogin(e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value.trim();
    var pass = document.getElementById('login-password').value;
    if (!email || !pass) {
      showError('login-error', 'Completa todos los campos');
      return;
    }
    // Demo login
    localStorage.setItem('alertaprecio_token', 'demo_token');
    localStorage.setItem('alertaprecio_user', JSON.stringify({
      id: 1, name: email.split('@')[0], email: email, plan: 'pro'
    }));
    window.location.href = 'index.html';
  }

  function handleRegister(e) {
    e.preventDefault();
    var name = document.getElementById('reg-name').value.trim();
    var email = document.getElementById('reg-email').value.trim();
    var pass = document.getElementById('reg-password').value;
    var pass2 = document.getElementById('reg-password2').value;
    var phone = document.getElementById('reg-whatsapp').value.trim();
    var company = document.getElementById('reg-company').value.trim();
    var terms = document.getElementById('reg-terms').checked;

    if (!name || !email || !pass) { showError('reg-error', 'Nombre, email y contraseña son requeridos'); return; }
    if (pass.length < 8) { showError('reg-error', 'La contraseña debe tener al menos 8 caracteres'); return; }
    if (pass !== pass2) { showError('reg-error', 'Las contraseñas no coinciden'); return; }
    if (!terms) { showError('reg-error', 'Debes aceptar los términos'); return; }

    // Simulate registration
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('success-page').style.display = 'block';

    localStorage.setItem('alertaprecio_token', 'demo_token_new');
    localStorage.setItem('alertaprecio_user', JSON.stringify({
      id: Date.now(), name: name, email: email, company: company,
      phone: phone, plan: 'pro', trial_ends: new Date(Date.now() + 14*86400000).toISOString()
    }));

    setTimeout(function() { window.location.href = 'index.html'; }, 2000);
  }

  function showError(id, msg) {
    var el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 4000);
  }

  function loginAs(plan) {
    localStorage.setItem('alertaprecio_token', 'demo_' + plan);
    localStorage.setItem('alertaprecio_user', JSON.stringify({
      id: plan === 'pro' ? 1 : 2,
      name: plan === 'pro' ? 'Marco Tienda Oficial' : 'Ana Seller Digital',
      email: plan + '@alertaprecio.mx',
      company: plan === 'pro' ? 'Tienda Oficial S.A.' : 'Digital Seller MX',
      plan: plan
    }));
    window.location.href = 'index.html';
  }
  </script>
</body>
</html>
