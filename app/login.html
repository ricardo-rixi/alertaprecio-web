<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — AlertaPrecio MX</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: var(--bg-card); padding: 2.5rem; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 440px; text-align: center; }
    .login-box h1 { color: var(--accent); margin-bottom: 0.3rem; }
    .login-box .subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
    .demo-card { background: rgba(37,99,235,0.1); border: 1px solid rgba(37,99,235,0.2); border-radius: 12px; padding: 1.2rem; margin: 1.5rem 0; text-align: left; }
    .demo-card h3 { color: var(--primary); margin-bottom: 0.8rem; font-size: 0.95rem; }
    .demo-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
    .demo-row:last-child { border: none; }
    .demo-row .plan { color: var(--accent); font-weight: 600; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>AlertaPrecio</h1>
    <p class="subtitle">Monitoreo inteligente de precios para e-commerce</p>

    <div class="demo-card">
      <h3>Demo — Dashboard</h3>
      <div class="demo-row"><span>Marco Tienda Oficial</span><span class="plan">PRO</span></div>
      <div class="demo-row"><span>Ana Seller Digital</span><span class="plan">STARTER</span></div>
      <div style="margin-top:0.8rem">
        <button class="btn btn-primary" style="width:100%" onclick="loginAs('pro')">Entrar como Pro (8 productos)</button>
        <button class="btn btn-outline" style="width:100%; margin-top:0.5rem" onclick="loginAs('starter')">Entrar como Starter (4 productos)</button>
      </div>
    </div>

    <p style="font-size:0.75rem; color:var(--text-muted); margin-top:1rem">
      Demo estatico — los datos son de muestra.<br>
      Version completa con backend en <a href="https://github.com/ricardo-rixi/alertaprecio-backend" style="color:var(--primary)">alertaprecio-backend</a>
    </p>
  </div>

  <script>
  function loginAs(plan) {
    localStorage.setItem('alertaprecio_token', 'demo_token_' + plan);
    localStorage.setItem('alertaprecio_user', JSON.stringify({
      id: plan === 'pro' ? 1 : 2,
      email: plan + '@alertaprecio.mx',
      name: plan === 'pro' ? 'Marco Tienda Oficial' : 'Ana Seller Digital',
      plan: plan
    }));
    window.location.href = 'index.html';
  }
  </script>
</body>
</html>
