<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos — AlertaPrecio MX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo">AlertaPrecio</div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">📊 Overview</a>
        <a href="productos.html" class="nav-item active">📦 Productos</a>
        <a href="alertas.html" class="nav-item">🔔 Alertas</a>
        <a href="config.html" class="nav-item">⚙️ Config</a>
      </nav>
      <div class="sidebar-footer">
        <span class="plan-badge-sidebar" id="plan-badge">Plan: Starter</span>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <h1>Productos</h1>
        <button class="btn btn-primary" id="add-product-btn">+ Agregar Producto</button>
      </header>
      <div class="content-area">
        <!-- Add Product Modal -->
        <div class="modal-overlay hidden" id="add-product-modal">
          <div class="modal">
            <div class="modal-header">
              <h2>Agregar Producto</h2>
              <button class="modal-close" id="close-modal">&times;</button>
            </div>
            <form id="add-product-form" class="modal-body">
              <div class="form-group">
                <label for="product-name">Nombre del Producto</label>
                <input type="text" id="product-name" placeholder="ej. Samsung Galaxy S25" required>
              </div>
              <div class="form-group">
                <label for="product-url">URL del Producto</label>
                <input type="url" id="product-url" placeholder="https://www.mercadolibre.com.mx/..." required>
              </div>
              <div class="form-group">
                <label for="product-platform">Plataforma</label>
                <select id="product-platform" required>
                  <option value="">Selecciona...</option>
                  <option value="mercadolibre">Mercado Libre</option>
                  <option value="amazon">Amazon MX</option>
                  <option value="shopify">Shopify</option>
                  <option value="other">Otra</option>
                </select>
              </div>
              <div class="form-group">
                <label for="product-competitors">URLs de Competidores (una por linea)</label>
                <textarea id="product-competitors" rows="3" placeholder="https://www.amazon.com.mx/...&#10;https://otra-tienda.mx/..."></textarea>
              </div>
              <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancel-modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Agregar</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Product Detail Modal -->
        <div class="modal-overlay hidden" id="detail-modal">
          <div class="modal modal-wide">
            <div class="modal-header">
              <h2 id="detail-title">Detalle del Producto</h2>
              <button class="modal-close" id="close-detail">&times;</button>
            </div>
            <div class="modal-body" id="detail-content">
              <div class="loading">Cargando...</div>
            </div>
          </div>
        </div>

        <div class="search-bar">
          <input type="text" id="product-search" placeholder="Buscar productos...">
        </div>
        <table class="data-table" id="products-table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Plataforma</th>
              <th>Precio Actual</th>
              <th>Competidores</th>
              <th>Ultima Actualizacion</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="6" class="empty-state">Cargando productos...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
